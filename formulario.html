<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Mascota - Veterinaria</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Veterinaria Huellitas 🐾</h1>
        <p>Registro de mascotas</p>
    </header>

    <main>

        <section class="formulario">

            <h2>Registrar Mascota</h2>

            <form id="formulario">

                <label for="nombre">
                    Nombre de la mascota:
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ej. Firulais"
                    required
                >


                <label for="especie">
                    Especie:
                </label>

                <select id="especie" name="especie" required>

                    <option value="">
                        Seleccione una especie
                    </option>

                    <option value="Perro">
                        Perro
                    </option>

                    <option value="Gato">
                        Gato
                    </option>

                    <option value="Ave">
                        Ave
                    </option>

                    <option value="Otro">
                        Otro
                    </option>

                </select>


                <label for="raza">
                    Raza:
                </label>

                <input
                    type="text"
                    id="raza"
                    name="raza"
                    placeholder="Ej. Labrador"
                >


                <label for="edad">
                    Edad:
                </label>

                <input
                    type="number"
                    id="edad"
                    name="edad"
                    min="0"
                    placeholder="Edad en años"
                >


                <label for="propietario">
                    Nombre del propietario:
                </label>

                <input
                    type="text"
                    id="propietario"
                    name="propietario"
                    placeholder="Nombre completo"
                    required
                >


                <label for="telefono">
                    Teléfono:
                </label>

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Ej. 70000000"
                >


                <label for="motivo">
                    Motivo de la consulta:
                </label>

                <textarea
                    id="motivo"
                    name="motivo"
                    rows="4"
                    placeholder="Describa el motivo de la consulta..."
                ></textarea>


                <button type="submit">
                    Registrar mascota
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 Veterinaria Huellitas</p>
    </footer>


    <script src="script-formulario.js"></script>

</body>

</html>
