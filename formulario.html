<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria Huellitas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Veterinaria Huellitas 🐾</h1>
        <p>Cuidamos a tus mejores amigos</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Registro de Mascota</h2>

            <form>
                <label for="nombre">Nombre de la mascota:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="especie">Especie:</label>
                <select id="especie" name="especie">
                    <option value="">Seleccione</option>
                    <option value="perro">Perro</option>
                    <option value="gato">Gato</option>
                    <option value="ave">Ave</option>
                    <option value="otro">Otro</option>
                </select>

                <label for="raza">Raza:</label>
                <input type="text" id="raza" name="raza">

                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="0">

                <label for="propietario">Nombre del propietario:</label>
                <input type="text" id="propietario" name="propietario" required>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono">

                <label for="motivo">Motivo de la consulta:</label>
                <textarea id="motivo" name="motivo" rows="4"></textarea>

                <button type="submit">Registrar mascota</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Veterinaria Huellitas</p>
    </footer>

</body>
</html>
